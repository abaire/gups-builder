[project]
name = "gups-builder"
version = "0.1.0"
description = "An LLM-assisted content builder for GUPS worlds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic>=2.5",
    "libcst",
    "rich",
    "prompt_toolkit",
    "tomli-w",
]

[project.scripts]
gups-builder = "gups_builder.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gups_builder"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
    "engine: needs a real gups binary",
]
